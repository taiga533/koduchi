# プルリクエストと main への push で走る検査。
#
# フロントエンドの検査は Linux で速く回し、Rust は配布と同じ macOS で回す。
# Tauri のフルビルドはここでは行わない（リリース時のみ。ADR 0011）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があったら、走っている古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: フロントエンド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # oven-sh/setup-bun@v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: 依存関係をロックファイルどおりに入れる
        run: bun install --frozen-lockfile

      - name: 型チェックとビルド
        run: bun run build

      - name: テスト
        run: bun run test

      - name: リント
        run: bun run lint --deny-warnings

      - name: 整形の確認
        run: bun run format:check

  rust:
    name: Rust とスクリプト
    # 配布物を作るのと同じ macOS で回す。ランナーの版は意図して固定している。
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Swatinem/rust-cache@v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: 整形の確認
        working-directory: src-tauri
        run: cargo fmt --check

      - name: リント
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Oracle Instant Client を入れていない環境でも通る（ADR 0010）。
      # Oracle を使う統合テストは KODUCHI_TEST_ORACLE_URL が無いので飛ばされる。
      - name: テスト
        working-directory: src-tauri
        run: cargo test

      # リリース時に macOS 上で走るスクリプトなので、同じ macOS で確かめる。
      - name: リリースタグ検査のテスト
        run: ./scripts/check-release-tag.test.sh
