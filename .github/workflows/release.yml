# v* タグを push すると、Apple Silicon 向けの dmg を作り、Developer ID で
# 署名して公証（notarization）し、GitHub の下書きリリースに添付する。
# 公開ボタンは人間が押す。署名と公証の決めごとは adr/0028-配布物の署名と公証.md。
#
# ここは tauri-apps/tauri-action で置き換えられる。今は使っていない。
# 理由と移行の見取り図は adr/0011-cicdとリリース配布.md にある。
name: Release

on:
  push:
    tags: ['v*']

# 下書きリリースの作成とアセットの添付に要る。
permissions:
  contents: write

jobs:
  release:
    name: dmg を作って下書きリリースに添付する
    # 配布物を作る環境は意図して固定している（ランナーが上がると
    # Xcode と SDK が変わり、dmg の対応 OS が動きうるため）。
    runs-on: macos-15
    timeout-minutes: 60
    # Liquid Glass のアイコン（icons/Koduchi.icon）を Assets.car へ焼くには
    # actool 26 以上が要る。macos-15 の既定は Xcode 16.4 なので、そのままだと
    # Tauri は警告だけ出して icon.icns へ落ちる。ランナーは固定したまま、
    # Xcode の版だけを明示して選ぶ。
    #
    # **これで SDK も動く**（16.4 の既定は macOS 15.5、26.3 は macOS 26.2）。
    # dmg の対応 OS はここで決まるため、Xcode の版もランナーと同じく
    # 決め打ちにしてある。上げるときは対応 OS への影響を見ること。
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      # タグの検査に main の履歴が要るので、全履歴を取る。
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # イミュータブルリリースは公開したら差し替えられない。
      # ビルドを始める前にここで止める。
      - name: リリースタグを検査する
        run: ./scripts/check-release-tag.sh "${GITHUB_REF_NAME}"

      # ランナーのイメージが変わって Xcode 26.3 が消えると、actool は既定の
      # 16.4 のものへ戻り、アイコンは黙って icon.icns へ落ちる。ここで止める。
      - name: ビルドに使う Xcode を確かめる
        run: |
          set -euo pipefail
          [ -d "${DEVELOPER_DIR}" ] || {
            echo "::error::${DEVELOPER_DIR} が無い。ランナーの Xcode を見直すこと。" >&2
            exit 1
          }
          xcodebuild -version
          actool --version --output-format=human-readable-text

      # 半端なアセットが混ざった下書きをそのまま公開してしまわないよう、
      # 同じタグの下書きが残っていたら消してから作り直す。
      # 公開済みのリリースがある場合は触らず落とす（イミュータブルリリース）。
      - name: 同じタグの下書きが残っていたら消す
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            echo "同じタグのリリースは無い"
            exit 0
          fi
          if [ "${state}" != 'true' ]; then
            echo "::error::${GITHUB_REF_NAME} は既に公開されている。作り直せない。" >&2
            exit 1
          fi
          echo "残っていた下書きを消す"
          gh release delete "${GITHUB_REF_NAME}" --yes

      # oven-sh/setup-bun@v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11

      - name: 依存関係をロックファイルどおりに入れる
        run: bun install --frozen-lockfile

      # Swatinem/rust-cache@v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      # 公証は App Store Connect API キーで行う（ADR 0028）。notarytool は
      # キーを**ファイルのパス**で受け取るため、secret から書き出す。
      # 置き場所はランナーの一時領域で、最後の手順で必ず消す。
      - name: 公証に使う API キーを書き出す
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          printf '%s' "${APPLE_API_KEY_P8}" | base64 --decode >"${dir}/AuthKey.p8"
          chmod 600 "${dir}/AuthKey.p8"
          # パスそのものは秘密ではない。中身だけが秘密である。
          echo "APPLE_API_KEY_PATH=${dir}/AuthKey.p8" >>"${GITHUB_ENV}"

      # Tauri は APPLE_CERTIFICATE から署名の識別名を取る。tauri.conf.json に
      # signingIdentity は書かない（書くと証明書名との一致検査に掛かり、
      # "-" のままだと dmg の署名そのものが飛ぶ。ADR 0028）。
      #
      # **ここでは公証しない。**APPLE_API_KEY / APPLE_API_ISSUER を渡すと
      # Tauri が .app を notary へ提出して待つが、その成果は捨てられる——
      # `--bundles dmg` は dmg を作り終えた時点で .app を消すためである
      # （実測: .app の公証待ちに 49 分、消される。dmg の公証は 24 秒）。
      # dmg を公証すれば notary が中身を展開して .app まで検証するので、
      # 提出は次の手順の 1 回で足りる（ADR 0028）。
      - name: dmg をビルドする（署名のみ）
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bun run tauri build --target aarch64-apple-darwin --bundles dmg

      - name: 作られた dmg のパスを控える
        id: dmg
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg \
            -maxdepth 1 -name '*.dmg' | head -n 1)"
          [ -n "${dmg}" ] || { echo 'dmg が見つからない' >&2; exit 1; }
          echo "path=${dmg}" >>"${GITHUB_OUTPUT}"
          echo "作られた dmg: ${dmg}"

      # 公証の提出はここ 1 回だけである（ADR 0028）。利用者が受け取るのは dmg
      # であり、dmg 自身に証跡が無いと Gatekeeper に止められる。notary は
      # 提出物の中身を展開して署名を検証するため、中の .app もこの 1 回で
      # 記録される。staple されるのは dmg だが、小槌は dmg でしか配らない。
      - name: dmg を公証して staple する
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "${DMG_PATH}" \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"

      # 署名も公証もアイコンも「ビルドが通った」では確かめられない。配る前に
      # ここで見る。1 つでも欠けたら赤にして、下書きを作らずに落とす。
      - name: 署名と公証とアイコンを確かめる
        env:
          DMG_PATH: ${{ steps.dmg.outputs.path }}
          EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # `--bundles dmg` は dmg を作り終えた時点で bundle/macos/*.app を
          # 消す。確かめる相手は**配る dmg の中身**であり、それが正しい。
          # 手元に残った .app を見ても、利用者が受け取るものの検査にならない。
          mount="$(mktemp -d)"
          cleanup() { hdiutil detach "${mount}" -quiet || true; }
          trap cleanup EXIT
          hdiutil attach "${DMG_PATH}" -nobrowse -readonly -mountpoint "${mount}"

          app="$(find "${mount}" -maxdepth 1 -name '*.app' | head -n 1)"
          [ -n "${app}" ] || { echo 'dmg の中に .app が見つからない' >&2; exit 1; }

          echo "== .app の署名 =="
          codesign --verify --strict --deep --verbose=2 "${app}"
          codesign -dv --verbose=4 "${app}" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'

          echo "== Team ID が期待どおりか =="
          actual="$(codesign -dv --verbose=4 "${app}" 2>&1 \
            | sed -n 's/^TeamIdentifier=//p')"
          if [ -z "${EXPECTED_TEAM_ID}" ]; then
            echo "::warning::vars.APPLE_TEAM_ID が空なので照合を飛ばす"
          elif [ "${actual}" != "${EXPECTED_TEAM_ID}" ]; then
            echo "::error::Team ID が違う（期待 ${EXPECTED_TEAM_ID} / 実際 ${actual}）" >&2
            exit 1
          fi

          echo "== ハードンドランタイムが効いているか =="
          codesign -dv --verbose=4 "${app}" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo '::error::hardened runtime が付いていない' >&2; exit 1; }

          # staple が付くのは dmg だけである（提出したのが dmg だから）。
          # 中の .app に `stapler validate` を当てても通らない。.app が
          # 公証されていることは、下の Gatekeeper の判定が確かめる
          # （証跡が無ければ notary へ問い合わせて判断する）。
          echo "== 公証の証跡（staple）=="
          xcrun stapler validate "${DMG_PATH}"

          echo "== Gatekeeper の判定 =="
          spctl -a -vvv -t exec "${app}"
          spctl -a -vvv -t open --context context:primary-signature "${DMG_PATH}"

          # actool が無い、または 26 未満だと、Tauri は警告を 1 行出すだけで
          # icon.icns へ落ちる。ビルドは緑のままなので気づけない。
          echo "== Liquid Glass のアイコンが焼かれているか =="
          [ -f "${app}/Contents/Resources/Assets.car" ] || {
            echo '::error::Assets.car が無い。actool が走っていない。' >&2
            exit 1
          }
          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' \
            "${app}/Contents/Info.plist" 2>/dev/null || true)"
          [ -n "${icon_name}" ] || {
            echo '::error::Info.plist に CFBundleIconName が無い。' >&2
            exit 1
          }
          echo "CFBundleIconName=${icon_name}"

      - name: 下書きリリースを作る
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: dmg を添付する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: gh release upload "${GITHUB_REF_NAME}" "${DMG_PATH}"

      - name: 次にすることを表示する
        run: |
          echo "下書きリリース ${GITHUB_REF_NAME} に署名・公証済みの dmg を添付した。"
          echo "dmg を開けることを確かめてから、GitHub 上で公開すること。"

      # 失敗しても必ず消す。ランナーは使い捨てだが、鍵をログや後続の手順から
      # 触れる場所に残さない。
      - name: 公証の API キーを消す
        if: always()
        run: rm -f "${APPLE_API_KEY_PATH:-}" || true
