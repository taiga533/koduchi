[package]
name = "koduchi"
version = "0.3.0"
description = "Oracle / PostgreSQL 対応の GUI データベースクライアント"
authors = ["Taiga Kawasaki"]
license-file = "../LICENSE"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "koduchi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# ODPI-C を介した Oracle ドライバ（ADR 0001）。動作には Oracle Instant Client が要る。
oracle = "0.6.3"
thiserror = "2.0.20"
toml = "0.9.8"
# 履歴とセッション復元の保管庫（ADR 0005）。SQLite 本体を同梱してビルドする。
rusqlite = { version = "0.40.2", features = ["bundled"] }
# パスワードの保存先である macOS Keychain（ADR 0004）。
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
# CSV の Shift_JIS 出力に使う。
encoding_rs = "0.8.35"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-window-state = "2.4.1"
# 結果テーブルの ⌘C をクリップボードへ載せる。
tauri-plugin-clipboard-manager = "2.3.3"
# 自動アップデート（ADR 0042）。2.13 は tauri 2.12 を要求するため、tauri を上げるときに併せて上げる。
tauri-plugin-updater = "2.12.0"

[dev-dependencies]
# InitParams::init() がプロセス 1 回きりであるため、
# Instant Client を触るテストは直列に走らせる必要がある（ADR 0001）。
serial_test = "3.5.0"
tempfile = "3.24.0"
# 既定のメニューの形（ADR 0040）を実物の `Menu::default` で見張るため、MockRuntime を使う。
# 版は [dependencies] の tauri と揃える。
tauri = { version = "2.11.5", features = ["test"] }
# 更新の公開鍵（ADR 0042）を、アプリが読むのと同じ解き方で見張る。
# 版は tauri-plugin-updater が使っているものと揃える。
base64 = "0.22.1"
minisign-verify = "0.2.5"

# muda は macOS でメニューを主スレッドでしか作らせない。テストの枠組みは各テストを
# 別のスレッドで走らせるため、枠組みを外して main から走らせる（ADR 0040）。
[[test]]
name = "menu"
harness = false
